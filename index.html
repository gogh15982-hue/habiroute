/* v5 onboarding completion transition */
.habiroute-transition {
  position: fixed; inset: 0; z-index: 99999;
  display:flex; align-items:center; justify-content:center;
  background:#F7F5F0; opacity:0; pointer-events:none;
  transition:opacity .35s ease;
}
.habiroute-transition.show { opacity:1; pointer-events:auto; }
.habiroute-transition-card { text-align:center; transform:translateY(8px); transition:transform .35s ease; }
.habiroute-transition.show .habiroute-transition-card { transform:translateY(0); }
.habiroute-transition-logo { font-weight:900; font-size:30px; color:#18212B; letter-spacing:-1.5px; }
.habiroute-transition-text { margin-top:12px; color:#6B7280; font-size:14px; }
.habiroute-transition-dots { display:flex; gap:5px; justify-content:center; margin-top:18px; }
.habiroute-transition-dots span { width:6px; height:6px; border-radius:50%; background:#FF6B35; animation:hrDot 1s infinite ease-in-out; }
.habiroute-transition-dots span:nth-child(2){animation-delay:.12s}
.habiroute-transition-dots span:nth-child(3){animation-delay:.24s}
@keyframes hrDot { 0%,70%,100%{transform:scale(.65);opacity:.35} 35%{transform:scale(1);opacity:1} }


/* v6:  is not part of the consumer launch navigation */

.habiroute-transition-card { min-width:260px; }

}

@keyframes hrProgress { from{width:0} to{width:100%} }

function routeUrl(view,data){
  if(view==='home') return location.pathname;
  const suffix=data&&data.postId?('-'+encodeURIComponent(data.postId)):'';

}
function pushRoute(view,data){
  const state={app:'habiroute',view:view,...(data||{})};
  history.pushState(state,'',routeUrl(view,data));
}
function replaceRoute(view,data){
  const state={app:'habiroute',view:view,...(data||{})};

}

    if(v==='detail') return openPostDetail(Number(state&&state.postId),false);

function normalizeTopic(t){
  if(t==="입문" || t==="질문" || t==="입문·질문") return "입문·질문";
  return t||"자유";
}
function topicForFilter(t){

  return p=>p.topic===t;
}
function normalizeComments(p){
  if(!Array.isArray(p.comments)) p.comments=[];
  p.comments=p.comments.map((c,i)=>{
    if(typeof c==='string') return {id:'c'+p.id+'_'+i,text:c,user:'하비루트 회원',replies:[]};
    return {id:c.id||('c'+p.id+'_'+i),text:c.text||'',user:c.user||'하비루트 회원',replies:Array.isArray(c.replies)?c.replies:[]};
  });
  return p.comments;
}
function commentCount(p){
  const cs=normalizeComments(p);
  return cs.length + cs.reduce((n,c)=>n+(Array.isArray(c.replies)?c.replies.length:0),0);
}

async function compressImage(file){
 return new Promise(resolve=>{
   const reader=new FileReader();
   reader.onerror=()=>resolve(null);
   reader.onload=()=>{
     const img=new Image();
     img.onload=()=>{
       const max=1600, scale=Math.min(1,max/Math.max(img.width,img.height));
       const canvas=document.createElement("canvas");
       canvas.width=Math.max(1,Math.round(img.width*scale)); canvas.height=Math.max(1,Math.round(img.height*scale));
       const ctx=canvas.getContext("2d"); ctx.drawImage(img,0,0,canvas.width,canvas.height);
       resolve(canvas.toDataURL("image/jpeg",0.82));
     };
     img.onerror=()=>resolve(null); img.src=reader.result;
   };
   reader.readAsDataURL(file);
 });
}

function recordSearch(q){
  q=String(q||"").trim(); if(!q)return;
  const counts=load("tuh_search_counts",{});
  counts[q]=(Number(counts[q])||0)+1;
  save("tuh_search_counts",counts);
  saveRecentSearch(q);
}
function getRecentSearches(){
  const arr=load("tuh_recent_searches",[]);
  return Array.isArray(arr)?arr.filter(Boolean).slice(0,10):[];
}
function saveRecentSearch(q){
  q=String(q||"").trim(); if(!q)return;
  const arr=getRecentSearches().filter(x=>String(x).toLowerCase()!==q.toLowerCase());
  arr.unshift(q);
  save("tuh_recent_searches",arr.slice(0,10));
}
function getPopularSearches(){
  const counts=load("tuh_search_counts",{});
  const defaults=["캠핑","러닝","등산","사진","자전거","낚시","골프","자동차","요리","헬스"];
  const all=[...new Set([...Object.keys(counts||{}),...defaults])];
  return all.sort((a,b)=>(Number(counts[b])||0)-(Number(counts[a])||0)||defaults.indexOf(a)-defaults.indexOf(b)).slice(0,10);
}

function runGlobalSearch(){
  const input=$("globalSearch"),box=$("searchResults");
  if(!input||!box)return;
  const raw=String(input.value||"").trim();
  if(!raw){box.innerHTML='<div class="search-empty">검색어를 입력해주세요.</div>';return;}
  recordSearch(raw);
  const q=raw.toLowerCase();
  const source=Array.isArray(posts)?posts:load("tuh_posts",seedPosts);
  const results=source.filter(p=>(String(p.title||"")+" "+String(p.body||"")+" "+String(p.hobby||"")+" "+String(normalizeTopic(p.topic)||"")).toLowerCase().includes(q));
  box.innerHTML='<div class="search-results-head">검색 결과 <strong>'+results.length+'</strong>건</div>'+
    (results.length?results.map(searchResultCard).join(""):'<div class="search-empty">"'+esc(raw)+'"에 대한 검색 결과가 없습니다.</div>');
  box.querySelectorAll("[data-search-post-id]").forEach(card=>{
    const open=()=>openPostDetail(Number(card.dataset.searchPostId));
    card.addEventListener("click",open);
    card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
  });
  // 검색어별 횟수 변화가 반영되도록 인기 검색어 순위도 즉시 갱신한다.
  const rankList=$("searchPage").querySelector(".search-rank-list");
  if(rankList){
    rankList.innerHTML=getPopularSearches().map((qv,i)=>'<button class="search-rank" type="button" data-popular-search="'+esc(qv)+'"><span class="rank">'+String(i+1).padStart(2,"0")+'</span><span>'+esc(qv)+'</span></button>').join("");
    rankList.querySelectorAll("[data-popular-search]").forEach(b=>b.addEventListener("click",()=>{
      $("globalSearch").value=b.dataset.popularSearch||""; runGlobalSearch();
    }));
  }
}

<script>
(function(){
  const WAIT = 2000;
  function showTransition(){
    const el=document.getElementById('habirouteTransition');
    if(!el) return;
    el.classList.add('show');
    el.setAttribute('aria-hidden','false');
    setTimeout(()=>el.classList.remove('show'), WAIT);
  }

  // Observe localStorage-based onboarding completion as a fallback.
  let last = localStorage.getItem('habiroute_onboarding_done');
  setInterval(()=>{
    const now=localStorage.getItem('habiroute_onboarding_done');
    if(now && now!==last){ last=now; showTransition(); }
  },120);

  // Expose a safe helper for the existing app code.
  window.habirouteOnboardingComplete = function(){
    showTransition();
    setTimeout(function(){
      if(typeof window.goHome === 'function') window.goHome();
      else if(typeof window.showPage === 'function') window.showPage('home');
    }, WAIT);
  };
})();
</script>

<script>
(function(){
  const GRADE = [
    {min:0, name:"새싹"},
    {min:60, name:"입문자"},
    {min:180, name:"취미인"},
    {min:420, name:"숙련자"},
    {min:900, name:"마스터"}
  ];
  function getXP(){
    return Number(localStorage.getItem("habiroute_xp") || 126);
  }
  function getGrade(xp){
    let g=GRADE[0];
    GRADE.forEach(x=>{ if(xp>=x.min) g=x; });
    return g;
  }
  window.habirouteAddXP=function(amount){
    const xp=Math.max(0,getXP()+Number(amount||0));
    localStorage.setItem("habiroute_xp",String(xp));
    window.habirouteRefreshGrade && window.habirouteRefreshGrade();
  };
  window.habirouteRefreshGrade=function(){
    const card=document.getElementById("hrGradeCard");
    if(!card) return;
    const xp=getXP(), g=getGrade(xp);
    const idx=GRADE.findIndex(x=>x===g);
    const next=GRADE[idx+1] || {min:g.min+500};
    const pct=Math.min(100, Math.max(0, ((xp-g.min)/(next.min-g.min))*100));
    const name=card.querySelector(".hr-grade-name");
    const badge=card.querySelector(".hr-grade-badge");
    const level=card.querySelector(".hr-level-number");
    const xpt=card.querySelector(".hr-level-xp");
    const bar=card.querySelector(".hr-progress span");
    if(name) name.textContent=g.name+" Lv."+Math.max(1,idx+1);
    if(badge) badge.textContent=g.name;
    if(level) level.textContent="Lv."+Math.max(1,idx+1)+" → Lv."+Math.max(1,idx+2);
    if(xpt) xpt.textContent=xp+" / "+next.min+" XP";
    if(bar) bar.style.width=pct+"%";
  };
  document.addEventListener("DOMContentLoaded",window.habirouteRefreshGrade);
})();
</script>

<script id="habiroute-v14-app">
(function(){
  const KEY='habiroute_posts_v14';
  const LIKES='habiroute_likes_v14';
  const SAVES='habiroute_saves_v14';

  const seed=[
    {id:'p1',cat:'입문·질문',hobby:'캠핑',user:'캠핑새싹',level:'입문자',title:'2인 캠핑 처음 가는데 꼭 필요한 것만 알려주세요',body:'텐트와 매트는 준비했는데 처음이라 나머지는 최소한으로 챙기고 싶어요. 초보 기준으로 꼭 필요한 것만 추천 부탁드립니다.',tags:['초보캠핑','장비'],likes:24,comments:8,saves:13,time:'12분 전'},
    {id:'p2',cat:'후기',hobby:'자동차·이륜차',user:'주말라이더',level:'숙련자',title:'이번 주말 300km 라이딩 후기',body:'서울에서 출발해서 강원도 쪽으로 다녀왔습니다. 도로 상태와 휴게 포인트 정리해봤어요.',tags:['바이크','라이딩'],likes:41,comments:12,saves:22,time:'31분 전'},
    {id:'p3',cat:'정보',hobby:'골프',user:'싱글도전',level:'취미인',title:'드라이버 슬라이스 줄이면서 제가 바꾼 3가지',body:'그립, 어드레스, 티 높이를 바꿔보고 체감했던 차이를 정리했습니다.',tags:['골프팁','드라이버'],likes:33,comments:6,saves:19,time:'1시간 전'},
    {id:'p4',cat:'자랑하기',hobby:'캠핑',user:'불멍러',level:'취미인',title:'첫 동계 캠핑 성공했습니다',body:'처음으로 영하권에서 캠핑했어요. 생각보다 재밌어서 기록 남겨봅니다.',tags:['동계캠핑','자랑'],likes:67,comments:15,saves:31,time:'2시간 전'},
    {id:'p5',cat:'자유',hobby:'자동차·이륜차',user:'차좋아',level:'취미인',title:'요즘 주말마다 세차하는 사람 있나요?',body:'평일엔 시간이 없어서 주말마다 세차하는 재미가 생겼네요.',tags:['세차','자동차'],likes:18,comments:9,saves:5,time:'3시간 전'}
  ];

  function getPosts(){
    try{return JSON.parse(localStorage.getItem(KEY)||'null')||seed.slice();}
    catch(e){return seed.slice();}
  }
  function savePosts(v){localStorage.setItem(KEY,JSON.stringify(v));}
  function getSet(k){try{return new Set(JSON.parse(localStorage.getItem(k)||'[]'));}catch(e){return new Set();}}
  function saveSet(k,s){localStorage.setItem(k,JSON.stringify([...s]));}
  function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

  let activeHobby=localStorage.getItem('habiroute_active_hobby') || '캠핑';
  let activeCat='전체';

  function ensureRoot(){
    let root=document.getElementById('habirouteV14Feed');
    if(root)return root;
    root=document.createElement('div');
    root.id='habirouteV14Feed';
    root.innerHTML=`
      <div class="hr-v14-feed-tools">
        <button class="hr-v14-tool active" data-cat="전체">전체</button>
        <button class="hr-v14-tool" data-cat="입문·질문">입문·질문</button>
        <button class="hr-v14-tool" data-cat="정보">정보</button>
        <button class="hr-v14-tool" data-cat="후기">후기</button>
        <button class="hr-v14-tool" data-cat="자랑하기">자랑하기</button>
        <button class="hr-v14-tool" data-cat="자유">자유</button>
      </div>
      <div id="habirouteV14Posts"></div>
      <button id="habirouteV14Write" class="hr-v14-write" aria-label="글쓰기">＋</button>
      <div id="habirouteV14Modal" class="hr-v14-modal">
        <div class="hr-v14-sheet">
          <h3>새 글 작성</h3>
          <div class="hr-v14-notice">좋은 글은 다른 취미인의 활동과 레벨에도 도움이 됩니다.</div>
          <select id="hrV14Cat" class="hr-v14-select">
            <option>입문·질문</option><option>정보</option><option>후기</option><option>자랑하기</option><option>자유</option>
          </select>
          <input id="hrV14Title" class="hr-v14-input" placeholder="제목을 입력하세요">
          <textarea id="hrV14Body" class="hr-v14-textarea" placeholder="취미 이야기를 자유롭게 적어주세요"></textarea>
          <input id="hrV14Tags" class="hr-v14-input" placeholder="태그 (쉼표로 구분)">
          <button id="hrV14Submit" class="hr-v14-primary">게시하기</button>
          <button id="hrV14Close" class="hr-v14-secondary">닫기</button>
        </div>
      </div>`;
    return root;
  }

  function render(){
    const root=ensureRoot();
    const target=document.getElementById('habirouteV14Posts');
    if(!target)return;
    const posts=getPosts();
    const likes=getSet(LIKES), saves=getSet(SAVES);
    const filtered=posts.filter(p=>p.hobby===activeHobby && (activeCat==='전체'||p.cat===activeCat));
    target.innerHTML=filtered.length?filtered.map(p=>`
      <article class="hr-v14-post">
        <div class="hr-v14-meta">${esc(p.level)} · ${esc(p.time)}</div></div>
        </div>
        <div class="hr-v14-post-title">${esc(p.title)}</div>
        <div class="hr-v14-post-body">${esc(p.body)}</div>
        <div>${(p.tags||[]).map(t=>`<span class="hr-v14-tag">#${esc(t)}</span>`).join('')}</div>
        <div class="hr-v14-actions">
          <button class="hr-v14-action ${likes.has(p.id)?'on':''}" data-like="${p.id}">♥ ${p.likes+(likes.has(p.id)?1:0)}</button>
          <button class="hr-v14-action">댓글 ${p.comments}</button>
          <button class="hr-v14-action ${saves.has(p.id)?'on':''}" data-save="${p.id}">저장 ${saves.has(p.id)?'됨':'하기'}</button>
        </div>
      </article>`).join(''):`<div class="hr-v14-empty">아직 이 취미의 글이 없어요.<br>첫 번째 글을 남겨보세요.</div>`;

    root.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===activeCat));
  }

  function mount(){
    // Prefer the main home/community content container, otherwise append to body.
    let host=document.querySelector('#homePage .content, #homePage main, #homePage') ||
             document.querySelector('#communityPage .content, #communityPage main, #communityPage');
    if(!host) return;
    if(!document.getElementById('habirouteV14Feed')) host.appendChild(ensureRoot());
    render();
  }

  document.addEventListener('click',function(e){
    const cat=e.target.closest('[data-cat]');
    if(cat && cat.closest('#habirouteV14Feed')){
      activeCat=cat.dataset.cat; render(); return;
    }
    const like=e.target.closest('[data-like]');
    if(like){
      const id=like.dataset.like, s=getSet(LIKES);
      s.has(id)?s.delete(id):s.add(id); saveSet(LIKES,s); render(); return;
    }
    const save=e.target.closest('[data-save]');
    if(save){
      const id=save.dataset.save, s=getSet(SAVES);
      s.has(id)?s.delete(id):s.add(id); saveSet(SAVES,s); render(); return;
    }
    if(e.target.id==='habirouteV14Write'){document.getElementById('habirouteV14Modal').classList.add('show');}
    if(e.target.id==='hrV14Close'){document.getElementById('habirouteV14Modal').classList.remove('show');}
    if(e.target.id==='hrV14Submit'){
      const title=document.getElementById('hrV14Title').value.trim();
      const body=document.getElementById('hrV14Body').value.trim();
      const cat=document.getElementById('hrV14Cat').value;
      const tags=document.getElementById('hrV14Tags').value.split(',').map(x=>x.trim()).filter(Boolean);
      if(!title||!body){alert('제목과 내용을 입력해주세요.');return;}
      const posts=getPosts();
      posts.unshift({id:'u'+Date.now(),cat,hobby:activeHobby,user:'나',level:'취미인',title,body,tags,likes:0,comments:0,saves:0,time:'방금 전'});
      savePosts(posts);
      document.getElementById('habirouteV14Title').value='';
      document.getElementById('habirouteV14Body').value='';
      document.getElementById('habirouteV14Tags').value='';
      document.getElementById('habirouteV14Modal').classList.remove('show');
      render();
    }
  },true);

  // When a hobby tab is clicked elsewhere in the app, sync the feed.
  document.addEventListener('click',function(e){
    const h=e.target.closest('[data-hobby]');
    if(h){
      const val=h.dataset.hobby || h.textContent.trim();
      if(val && val!=='취미 추가 +'){
        activeHobby=val; localStorage.setItem('habiroute_active_hobby',val);
        setTimeout(render,30);
      }
    }
  },true);

  window.habirouteV14Mount=mount;
  window.habirouteV14Render=render;
  // legacy overlay disabled; main community renderer owns the feed.
})();
</script>

.hr-v14-feed-tools{display:flex;gap:0;overflow:auto;border-bottom:1px solid #DCD8D0;background:#fff;margin-bottom:6px}
.hr-v14-tool{border:0;background:#fff;padding:10px 13px;color:#666;font-weight:700;font-size:13px;white-space:nowrap;border-bottom:2px solid transparent}
.hr-v14-tool.active{color:#18212B;border-bottom-color:#FF6B35}
.hr-v14-post{border-radius:2px!important;padding:7px 10px!important;margin:0!important;background:#fff;border:0!important;border-bottom:1px solid #E6E1D8!important}
.hr-v14-compact-meta{font-size:11px!important;gap:8px!important}
.hr-v14-post-title{font-size:14px!important;font-weight:800!important;line-height:1.3!important;margin:3px 0 2px!important}
.hr-v14-post-body,.hr-v14-post>div:nth-of-type(4){display:none!important}
.hr-v14-actions{margin-top:2px!important;gap:10px!important}
.hr-v14-action{font-size:11px!important;padding:0!important}

.hr-comment-write{display:flex;gap:7px;margin-top:12px}
